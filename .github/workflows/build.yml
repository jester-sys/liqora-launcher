
name: Build and Release Liqora APK

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-release:
        name: Build and Release APK
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: temurin
                  cache: gradle

            - name: Run Unit Tests
              run: ./gradlew testFossDebugUnitTest --stacktrace
 
            - name: Build Debug APK
              run: |
                  chmod +x gradlew
                  ./gradlew assembleFossDebug --stacktrace

            - name: Publish APK to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: build-${{ github.run_number }}
                  name: Liqora Build ${{ github.run_number }}
                  body: |
                      Automated Liqora Android build.
                      Commit: ${{ github.sha }}
                  files: app/build/outputs/apk/foss/debug/*.apk
                  generate_release_notes: true
