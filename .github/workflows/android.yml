
name: Liqora Android CI

on:
    push:

permissions:
    contents: read

jobs:
    build:
        name: Build Liqora
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Make Gradle Wrapper executable
              run: chmod +x gradlew

            - name: Build Android app
              run: ./gradlew assembleDebug
